name: Terraform State Recovery Lab CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  state-labs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: hashicorp/setup-terraform@v4
        with: {terraform_version: "~> 1.9", terraform_wrapper: false}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: terraform fmt -check -recursive labs
      - run: python -m unittest discover -s tests -v
      - run: python scripts/recovery_lab.py move
      - run: python scripts/recovery_lab.py detach
      - run: python scripts/recovery_lab.py drift
      - run: python scripts/check_repository.py
